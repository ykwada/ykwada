name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fork of vn7n24fzkq/github-profile-summary-cards with the
      # INCLUDE_PRIVATE_CONTRIBUTIONS input (branch feat/include-private-contributions),
      # pinned to a commit so the executed code cannot change under us.
      - uses: ykwada/github-profile-summary-cards@1b02d0c5ecf8622d3461b82561c4bde925d3717c
        env:
          # PAT stored as a repository secret. Never hardcode a token here.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          THEME: prussian
          TIME_ZONE: Asia/Tokyo
          EXCLUDE: HTML,CSS,Shell
          EXCLUDE_REPOS: ykwada
          AUTO_PUSH: true
          INCLUDE_PRIVATE_CONTRIBUTIONS: true
