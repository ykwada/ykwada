name: Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # PAT stored as a repository secret. Never hardcode a token here.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          THEME: prussian
          TIME_ZONE: Asia/Tokyo
          EXCLUDE: HTML,CSS,Shell
          EXCLUDE_REPOS: ykwada
          AUTO_PUSH: true
