name: Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile stats
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

          INCLUDE_PRIVATE: "true"
          INCLUDE_ORG_REPOS: "true"

          CARD_THEME: dark
          TOP_LANGUAGES: "6"
          INCLUDE_FORKS: "false"
          INCLUDE_ARCHIVED: "false"

          EXCLUDED_LANGUAGES: HTML,CSS,Shell
          EXCLUDED_REPOS: ykwada

        run: python scripts/generate_stats.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git diff --cached --quiet || \
            git commit -m "chore: update profile stats"

          git push